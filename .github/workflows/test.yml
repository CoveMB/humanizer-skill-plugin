name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "HEAD~1..HEAD"
          fi

      - name: Run tests
        run: make test

      - name: Check branch coverage
        run: make coverage

      - name: Check eval matrix
        run: make eval-humanizer-dry-run

      - name: Check eval flag variations
        run: >-
          make eval-humanizer-dry-run
          EVAL_ARGS='--filter explicit_dense_rewrite --filter contextual_docs_cleanup
          --rubric-grade --model gpt-5.5 --timeout-seconds 600
          --cases evals/humanizer_eval_cases.json
          --artifacts-dir /tmp/humanizer-eval-artifacts --codex-bin codex'

      - name: Check Faithful eval stability flags
        run: >-
          make eval-humanizer-dry-run
          EVAL_ARGS='--target-skill faithful-humanizer --trials 3
          --rubric-grade --rubric-model gpt-5.5'

      - name: Check rubric calibration matrix
        run: >-
          make eval-humanizer-dry-run
          EVAL_ARGS='--calibrate-rubric'
