name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  rename:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/add-form-only-humanizer'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-form-only-humanizer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Complete internal rename
        run: |
          exec > >(tee /tmp/humanizer-rename.log) 2>&1

          if [ ! -d skills/humanizer ] && [ ! -d skills/humanizer-form ]; then
            echo "Rename already complete."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/run_humanizer_evals.py"),
              Path("tests/test_humanizer_eval_runner.py"),
          ]

          replacements = [
              ("skills/humanizer/references/banned-list.md", "skills/editorial-humanizer/references/banned-list.md"),
              ("skills/humanizer/SKILL.md", "skills/editorial-humanizer/SKILL.md"),
              ("skills/humanizer-form/SKILL.md", "skills/faithful-humanizer/SKILL.md"),
              ("docs/humanizer-form-research.md", "docs/faithful-humanizer-research.md"),
              ("Use $humanizer", "Use $editorial-humanizer"),
              ("Use Humanizer", "Use Editorial Humanizer"),
              ("final Humanizer output", "final Editorial Humanizer output"),
              ("Grade this Humanizer eval output", "Grade this Editorial Humanizer eval output"),
              ("Humanizer eval case(s)", "Editorial Humanizer eval case(s)"),
              ("live Codex evals for the Humanizer skill", "live Codex evals for Editorial Humanizer"),
          ]

          for path in paths:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          git mv tests/test_humanizer_form_artifacts.py tests/test_faithful_humanizer_artifacts.py
          git rm -r skills/humanizer skills/humanizer-form
          git rm docs/humanizer-form-research.md
          git rm .github/workflows/rename-humanizers.yml

          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            push:
              branches:
                - main
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Check whitespace
                  run: |
                    if [ "${{ github.event_name }}" = "pull_request" ]; then
                      git diff --check "origin/${{ github.base_ref }}...HEAD"
                    elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                      git diff --check "${{ github.event.before }}..${{ github.sha }}"
                    else
                      git diff --check "HEAD~1..HEAD"
                    fi

                - name: Run tests
                  run: make test

                - name: Check eval matrix
                  run: make eval-humanizer-dry-run

                - name: Check eval flag variations
                  run: >-
                    make eval-humanizer-dry-run
                    EVAL_ARGS='--filter explicit_dense_rewrite --filter contextual_docs_cleanup
                    --rubric-grade --model gpt-5.5 --timeout-seconds 600
                    --cases evals/humanizer_eval_cases.json
                    --artifacts-dir /tmp/humanizer-eval-artifacts --codex-bin codex'
          YAML

          git diff --check
          make test
          make eval-humanizer-dry-run

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete Editorial and Faithful Humanizer rename"
          git push origin HEAD:agent/add-form-only-humanizer

      - name: Upload rename log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanizer-rename-log
          path: /tmp/humanizer-rename.log

  test:
    needs: rename
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "HEAD~1..HEAD"
          fi

      - name: Run tests
        run: make test

      - name: Check eval matrix
        run: make eval-humanizer-dry-run

      - name: Check eval flag variations
        run: >-
          make eval-humanizer-dry-run
          EVAL_ARGS='--filter explicit_dense_rewrite --filter contextual_docs_cleanup
          --rubric-grade --model gpt-5.5 --timeout-seconds 600
          --cases evals/humanizer_eval_cases.json
          --artifacts-dir /tmp/humanizer-eval-artifacts --codex-bin codex'
