name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  fix-provenance:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/add-form-only-humanizer'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-form-only-humanizer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix path and add regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("scripts/run_humanizer_evals.py")
          runner = runner_path.read_text(encoding="utf-8")
          old = 'Path(installed_path) / "skills" / "humanizer" / "SKILL.md"'
          new = 'Path(installed_path) / "skills" / "editorial-humanizer" / "SKILL.md"'
          if old not in runner:
              raise SystemExit("stale provenance path not found")
          runner_path.write_text(runner.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_humanizer_eval_runner.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_verify_eval_plugin_is_model_visible_targets_editorial_skill"
          if test_name not in tests:
              marker = "    def test_require_isolated_codex_home_rejects_missing_and_default_home(self):\n"
              method = '''    def test_verify_eval_plugin_is_model_visible_targets_editorial_skill(self):
        with tempfile.TemporaryDirectory() as temporary_directory:
            installed_path = Path(temporary_directory) / "plugin"
            expected_path = (
                installed_path
                / "skills"
                / "editorial-humanizer"
                / "SKILL.md"
            ).resolve()
            with mock.patch.object(
                self.runner,
                "run_cli_json",
                return_value={"prompt_input": str(expected_path)},
            ):
                actual_path = self.runner.verify_eval_plugin_is_model_visible(
                    "codex",
                    "humanizer-plugin@humanizer-eval-test",
                    installed_path,
                    {},
                )
            self.assertEqual(actual_path, str(expected_path))

'''
              if marker not in tests:
                  raise SystemExit("test insertion marker not found")
              tests = tests.replace(marker, method + marker)
              test_path.write_text(tests, encoding="utf-8")
          PY

          git diff --check
          make test
          make eval-humanizer-dry-run

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_humanizer_evals.py tests/test_humanizer_eval_runner.py
          git commit -m "fix: target Editorial Humanizer in eval provenance"
          git push origin HEAD:agent/add-form-only-humanizer

  test:
    needs: fix-provenance
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "HEAD~1..HEAD"
          fi

      - name: Run tests
        run: make test

      - name: Check eval matrix
        run: make eval-humanizer-dry-run

      - name: Check eval flag variations
        run: >-
          make eval-humanizer-dry-run
          EVAL_ARGS='--filter explicit_dense_rewrite --filter contextual_docs_cleanup
          --rubric-grade --model gpt-5.5 --timeout-seconds 600
          --cases evals/humanizer_eval_cases.json
          --artifacts-dir /tmp/humanizer-eval-artifacts --codex-bin codex'
