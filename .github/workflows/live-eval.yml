name: Live Eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Codex model to use for live evals"
        required: true
        default: "gpt-5.5"
      rubric_model:
        description: "Optional separate Codex model for rubric grading"
        required: false
        default: ""
      target_skill:
        description: "Optional target skill filter"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - editorial-humanizer
          - faithful-humanizer
          - plain-language-humanizer
      trials:
        description: "Number of trials per selected case"
        required: true
        default: "1"
      timeout_seconds:
        description: "Per-case timeout in seconds"
        required: true
        default: "300"
      filter:
        description: "Optional single eval case id to run"
        required: false
        default: ""
      rubric_grade:
        description: "Run optional rubric grading pass"
        required: false
        type: boolean
        default: false

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm i -g @openai/codex@latest

      - name: Authenticate Codex CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required" >&2
            exit 2
          fi
          eval_home_dir="${RUNNER_TEMP:?RUNNER_TEMP is required}/home"
          eval_codex_dir="${RUNNER_TEMP:?RUNNER_TEMP is required}/codex-home"
          printf 'CODEX_HOME=%s\n' "$eval_codex_dir" >> "$GITHUB_ENV"
          mkdir -p "$eval_home_dir" "$eval_codex_dir"
          {
            printf '[cli_auth]\n'
            printf 'credentials_store = "file"\n'
          } > "$eval_codex_dir/config.toml"
          printf '%s' "$OPENAI_API_KEY" | env HOME="$eval_home_dir" CODEX_HOME="$eval_codex_dir" codex login --with-api-key
          env HOME="$eval_home_dir" CODEX_HOME="$eval_codex_dir" codex login status

      - name: Run deterministic tests
        run: make test

      - name: Check eval matrix
        run: make eval-humanizer-dry-run

      - name: Run live eval
        env:
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_RUBRIC_MODEL: ${{ inputs.rubric_model }}
          EVAL_TARGET_SKILL: ${{ inputs.target_skill }}
          EVAL_TRIALS: ${{ inputs.trials }}
          EVAL_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          EVAL_FILTER: ${{ inputs.filter }}
          EVAL_RUBRIC_GRADE: ${{ inputs.rubric_grade }}
        run: |
          eval_args=(--model "$EVAL_MODEL" --timeout-seconds "$EVAL_TIMEOUT_SECONDS" --trials "$EVAL_TRIALS")
          if [ -n "$EVAL_RUBRIC_MODEL" ]; then
            eval_args+=(--rubric-model "$EVAL_RUBRIC_MODEL")
          fi
          if [ "$EVAL_TARGET_SKILL" != "all" ]; then
            eval_args+=(--target-skill "$EVAL_TARGET_SKILL")
          fi
          if [ -n "$EVAL_FILTER" ]; then
            eval_args+=(--filter "$EVAL_FILTER")
          fi
          if [ "$EVAL_RUBRIC_GRADE" = "true" ]; then
            eval_args+=(--rubric-grade)
          fi
          python3 scripts/run_humanizer_evals.py "${eval_args[@]}"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanizer-live-eval-artifacts
          path: evals/artifacts/latest/
          if-no-files-found: ignore
